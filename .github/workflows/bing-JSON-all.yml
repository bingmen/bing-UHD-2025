# .github/workflows/bing-JSON-all.yml
name: bing-JSON-all

on:
  # schedule:
    # - cron: "0 22 * * *"   # daily 22:00 UTC (after Bing rollover)
  workflow_dispatch:
    inputs:
      years:
        description: "Years to process (space-separated)"
        required: false
        default: "2025"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mkt: ["de-DE", "en-CA", "en-GB", "en-IN", "en-US",
              "fr-FR", "it-IT", "ja-JP", "zh-CN"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Fetch JSON (per market/year)
        run: |
          YEAR="${{ github.event.inputs.years || '2025' }}"
          YEAR="${YEAR%% *}"
          URL="https://raw.onmicrosoft.cn/Bing-Wallpaper-Action/main/data/bing-JSON-${{ matrix.mkt }}-${YEAR}.json"
          echo "Fetching $URL"
          curl -fsSL "$URL" -o "bing-JSON-${{ matrix.mkt }}-${YEAR}.json" || echo "no JSON for ${{ matrix.mkt }} ${YEAR}"

      - name: Download images & build Markdown
        run: |
          YEAR="${{ github.event.inputs.years || '2025' }}"
          YEAR="${YEAR%% *}"
          python bing-JSON-all.py . "$YEAR"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "bing-JSON-${{ matrix.mkt }}-"*.json \
                  "bing-UHD-${{ matrix.mkt }}-"* "bing-320-${{ matrix.mkt }}-"* || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(${{ matrix.mkt }}): update Bing wallpapers"
            git push
          fi
