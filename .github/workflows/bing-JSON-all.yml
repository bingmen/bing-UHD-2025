# .github/workflows/bing-JSON-all.yml
name: bing-JSON-all

on:
  push:
    paths:
      - 'bing-JSON-*.json'
      - 'bing-JSON-all.py'
      - '.github/workflows/bing-JSON-all.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 临时调大 Git 缓冲区至 500MB
      - name: Increase Git buffer (500MB)
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

      - name: Run bing-JSON-all.py
        run: python bing-JSON-all.py

      # 分次传输：分批 add + commit，降低单次 push 体积
      - name: Commit & Push (batched)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 用 find 收集目标文件，按 NUL 分隔，过滤空项，避免空 pathspec
          FILES=()
          while IFS= read -r -d '' f; do
            [ -n "$f" ] && FILES+=("$f")
          done < <(find . -maxdepth 1 -type f \
                    \( -name 'bing-UHD-*' -o -name 'bing-320-*' -o -name 'bing-UHD-*.md' \) \
                    -print0 2>/dev/null || true)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No target files found, skip"
          else
            BATCH=20
            TOTAL=${#FILES[@]}
            echo "Total files: $TOTAL, batch size: $BATCH"
            for ((i=0; i<TOTAL; i+=BATCH)); do
              CHUNK=("${FILES[@]:i:BATCH}")
              # 二次防御：剔除空串
              CLEAN=()
              for x in "${CHUNK[@]}"; do
                [ -n "$x" ] && CLEAN+=("$x")
              done
              [ ${#CLEAN[@]} -eq 0 ] && continue

              git add -- "${CLEAN[@]}"
              if git diff --cached --quiet; then
                echo "Batch $((i/BATCH+1)): no changes"
                continue
              fi
              git commit -m "chore: update bing wallpapers (batch $((i/BATCH+1))) $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
              git push
              echo "Batch $((i/BATCH+1)) pushed (${#CLEAN[@]} files)"
            done
          fi

          # 兜底：提交剩余变更（如删除项、其他文件）
          git add -A
          if git diff --cached --quiet; then
            echo "No remaining changes"
          else
            git commit -m "chore: update bing wallpapers (final) $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi
