# .github/workflows/bing-JSON-all.yml
name: bing-JSON-all

on:
  workflow_dispatch:
    inputs:
      mkt:
        description: "市场 (market)"
        required: true
        default: "zh-CN"
        type: choice
        options:
          - de-DE
          - en-CA
          - en-GB
          - en-IN
          - en-US
          - fr-FR
          - it-IT
          - ja-JP
          - zh-CN
      year:
        description: "年份 (year)"
        required: true
        default: "2025"
        type: string

permissions:
  contents: write

concurrency:
  group: bing-JSON-all-${{ inputs.mkt }}-${{ inputs.year }}
  cancel-in-progress: false

jobs:
  download-and-build:
    name: Download UHD & Build Markdown (${{ inputs.mkt }} / ${{ inputs.year }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify JSON input exists
        run: |
          test -f "bing-JSON-${{ inputs.mkt }}-${{ inputs.year }}.json" \
            || (echo "::error::缺少 bing-JSON-${{ inputs.mkt }}-${{ inputs.year }}.json" && exit 1)

      - name: Run download script
        run: |
          python bing-JSON-all.py \
            --mkt "${{ inputs.mkt }}" \
            --year "${{ inputs.year }}"

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "bing-UHD-${{ inputs.mkt }}-${{ inputs.year }}" \
                  "bing-320-${{ inputs.mkt }}-${{ inputs.year }}" \
                  "bing-UHD-${{ inputs.mkt }}-${{ inputs.year }}.md" || true

          if git diff --cached --quiet; then
            echo "没有变更需要提交。"
            exit 0
          fi

          git commit -m "chore: update bing UHD ${{ inputs.mkt }} ${{ inputs.year }} ($(date -u +'%Y-%m-%d %H:%M:%S') UTC)"
          git push origin HEAD
