# .github/workflows/bing-JSON-all.yml
name: bing-JSON-all

on:
  push:
    paths:
      - 'bing-JSON-*.json'
      - 'bing-JSON-all.py'
      - '.github/workflows/bing-JSON-all.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run bing-JSON-all.py
        run: python bing-JSON-all.py

      - name: Commit & Push (Git LFS)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 安装并初始化 Git LFS
          git lfs install

          # 配置需要 LFS 跟踪的文件类型
          git lfs track "bing-UHD-*"
          git lfs track "bing-320-*"

          # 确保 .gitattributes 被提交
          git add .gitattributes

          # 添加目标文件
          git add bing-UHD-* bing-320-* "bing-UHD-*.md"

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update bing wallpapers $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi
