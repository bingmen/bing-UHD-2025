# .github/workflows/bing-JSON-all.yml
name: bing-JSON-all

on:
  push:
    paths:
      - 'bing-JSON-*.json'
      - 'bing-JSON-all.py'
      - '.github/workflows/bing-JSON-all.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run bing-JSON-all.py
        run: python bing-JSON-all.py

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 增加 HTTP 缓冲区，缓解大数据量推送时的传输问题
          git config http.postBuffer 524288000
          
          git add bing-UHD-* bing-320-* "bing-UHD-*.md"
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update bing wallpapers $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            
            # 重试推送逻辑（最多 3 次，间隔递增）
            max_retries=3
            retry_delay=10
            
            for i in $(seq 1 $max_retries); do
              echo "Push attempt $i of $max_retries..."
              if git push; then
                echo "Push succeeded."
                break
              else
                echo "Push failed with exit code $?. Retrying in ${retry_delay}s..."
                sleep $retry_delay
                retry_delay=$((retry_delay * 2))  # 指数退避
              fi
              
              if [ $i -eq $max_retries ]; then
                echo "Push failed after $max_retries attempts."
                exit 1
              fi
            done
          fi
