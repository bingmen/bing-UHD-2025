# .github/workflows/bing-JSON-single.yml
name: bing-JSON-single

on:
  push:
    paths:
      - 'bing-JSON-*.json'
      - 'bing-JSON-single.py'
      - '.github/workflows/bing-JSON-single.yml'
  workflow_dispatch:
    inputs:
      mkt:
        description: 'Market (e.g. zh-CN)'
        required: true
        default: 'zh-CN'
        type: choice
        options:
          - de-DE
          - en-CA
          - en-GB
          - en-IN
          - en-US
          - fr-FR
          - it-IT
          - ja-JP
          - zh-CN

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mkt:
          - de-DE
          - en-CA
          - en-GB
          - en-IN
          - en-US
          - fr-FR
          - it-IT
          - ja-JP
          - zh-CN

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 临时调大 Git 缓冲区至 500MB
      - name: Increase Git buffer (500MB)
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

      - name: Run bing-JSON-single.py (${{ matrix.mkt }})
        run: python bing-JSON-single.py ${{ matrix.mkt }}

      # 分批 add + commit + push；stash 放循环外，push 前 pull --rebase，push 失败不吞错
      - name: Commit & Push (batched, ${{ matrix.mkt }})
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MKT="${{ matrix.mkt }}"

          # 循环外先 stash 一次：把未跟踪/未暂存改动收进 stash（若无改动则跳过）
          if ! git diff --quiet || ! git diff --cached --quiet || \
             [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push --include-untracked -m "pre-batch-stash-${MKT}-$(date -u +%s)"
            echo "Stashed pre-existing changes"
          else
            echo "Nothing to stash"
          fi

          # 用 find 收集目标文件（仅当前 mkt），按 NUL 分隔，过滤空项
          FILES=()
          while IFS= read -r -d '' f; do
            [ -n "$f" ] && FILES+=("$f")
          done < <(find . -maxdepth 1 -type f \
                    \( -name "bing-UHD-${MKT}-*" -o -name "bing-320-${MKT}-*" -o -name "bing-UHD-${MKT}-*.md" \) \
                    -print0 2>/dev/null || true)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No target files found for ${MKT}, skip"
          else
            BATCH=20
            TOTAL=${#FILES[@]}
            echo "Total files: $TOTAL, batch size: $BATCH"
            for ((i=0; i<TOTAL; i+=BATCH)); do
              CHUNK=("${FILES[@]:i:BATCH}")
              CLEAN=()
              for x in "${CHUNK[@]}"; do
                [ -n "$x" ] && CLEAN+=("$x")
              done
              [ ${#CLEAN[@]} -eq 0 ] && continue

              git add -- "${CLEAN[@]}"
              if git diff --cached --quiet; then
                echo "Batch $((i/BATCH+1)): no changes"
                continue
              fi
              git commit -m "chore(${MKT}): update bing wallpapers (batch $((i/BATCH+1))) $(date -u +'%Y-%m-%d %H:%M:%S') UTC"

              # 每次 push 前重新 pull --rebase
              git pull --rebase origin "${GITHUB_REF_NAME}"

              # push 失败明确报错（set -e 已保证非零退出）
              if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "::error::git push failed for ${MKT} batch $((i/BATCH+1))"
                exit 1
              fi
              echo "Batch $((i/BATCH+1)) pushed (${#CLEAN[@]} files)"
            done
          fi

          # 兜底：提交剩余变更（如删除项、其他文件）
          git add -A
          if git diff --cached --quiet; then
            echo "No remaining changes"
          else
            git commit -m "chore(${MKT}): update bing wallpapers (final) $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::error::git push failed for ${MKT} final"
              exit 1
            fi
          fi

          # 恢复循环外 stash 的改动（若有）
          if git stash list | grep -q "pre-batch-stash-${MKT}"; then
            git stash pop || echo "::warning::stash pop failed, left in stash list"
          fi
